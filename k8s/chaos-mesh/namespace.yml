apiVersion: v1
kind: Namespace
metadata:
  name: chaos-mesh
  labels:
    app.kubernetes.io/part-of: chaos-pipeline
    # Chaos Mesh injects sidecars / runs privileged DaemonSets — opt the
    # namespace into the privileged Pod Security profile up front so the
    # operator isn't fighting admission rejections.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
