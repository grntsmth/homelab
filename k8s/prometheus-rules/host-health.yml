# =============================================================================
# PrometheusRule — host-health alerts.
#
# Ports the 4 alerts from monitoring/monitoring.yml's prometheus-config
# ConfigMap into the kube-prometheus-stack PrometheusRule format. Picked
# up by the chart's Prometheus via the `release: kube-prometheus-stack`
# label selector — same pattern as chaos-rules.yml.
#
# CPU thresholds differ per node because workload distribution is uneven:
#
#   high-palace (role=game-server) runs Minecraft, all plugins, Chronicle,
#   and acts as the Ollama relay endpoint. Sustained >90% under normal
#   load (world generation, plugin compiles, multi-minute LLM inference)
#   is expected behaviour, not anomaly. Threshold lifted to 95% with a
#   15m sustain window.
#
#   star-garden (role=watchtower) runs only the monitoring stack. Any
#   sustained >90% there is genuinely abnormal. Kept at the original
#   90% / 10m threshold.
#
# kube-prometheus-stack ships overlapping defaults (NodeCPUHighUsage,
# NodeMemoryHighUtilization, NodeFilesystemAlmostOutOfSpace). Disable
# them in the Helm values to avoid double-paging:
#
#   defaultRules:
#     rules:
#       nodeExporterAlerting: false   # disables Node* alerts as a group
#
# (Granular per-rule overrides are not exposed by the chart — it's
# all-or-nothing per rule group.)
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: host-health
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: chaos-pipeline
spec:
  groups:
    - name: host-cpu
      interval: 30s
      rules:
        - alert: HighCPUUsage
          expr: |
            100 - (
              avg by(instance) (
                rate(node_cpu_seconds_total{mode="idle",instance="high-palace"}[5m])
              ) * 100
            ) > 95
          for: 15m
          labels:
            severity: warning
            team: infrastructure
            node_role: game-server
          annotations:
            summary: "Sustained high CPU on game-server {{ $labels.instance }}"
            description: |
              CPU usage on {{ $labels.instance }} has held above 95% for
              the last 15 minutes (current: {{ $value | printf "%.1f" }}%).

              high-palace runs workload pods (Minecraft, plugins, Chronicle,
              ollama-relay). Short bursts above 95% are normal during
              world-gen or LLM inference — this fires only on sustained
              pegging. Triage:

                kubectl top pods --all-namespaces --sort-by=cpu | head -10
                ~/fortress-minecraft/bin/mc-logs --tail=200

        - alert: HighCPUUsage
          expr: |
            100 - (
              avg by(instance) (
                rate(node_cpu_seconds_total{mode="idle",instance="star-garden"}[5m])
              ) * 100
            ) > 90
          for: 10m
          labels:
            severity: warning
            team: infrastructure
            node_role: watchtower
          annotations:
            summary: "Sustained high CPU on watchtower {{ $labels.instance }}"
            description: |
              CPU usage on {{ $labels.instance }} has held above 90% for
              10 minutes (current: {{ $value | printf "%.1f" }}%).

              star-garden runs only the monitoring stack — sustained CPU
              there is genuinely abnormal. Likely causes: Prometheus
              query overload, runaway Loki ingestion, or an alert storm.

                kubectl top pods -n monitoring --sort-by=cpu

    - name: host-memory
      interval: 30s
      rules:
        - alert: HighMemoryUsage
          expr: |
            (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
          for: 5m
          labels:
            severity: warning
            team: infrastructure
          annotations:
            summary: "High memory usage on {{ $labels.instance }}"
            description: |
              Memory usage on {{ $labels.instance }} is
              {{ $value | printf "%.1f" }}% (threshold: 90%).

              Memory leaks are sneaky — the 5m window is intentionally
              short. Identify the offender:

                kubectl top pods --all-namespaces --sort-by=memory | head -10

    - name: host-disk
      interval: 30s
      rules:
        - alert: DiskSpaceLow
          expr: |
            (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
          for: 5m
          labels:
            severity: critical
            team: infrastructure
          annotations:
            summary: "Disk space low on {{ $labels.instance }}"
            description: |
              Root filesystem on {{ $labels.instance }} is
              {{ $value | printf "%.1f" }}% full (threshold: 85%).

              At 100% the cluster stops admitting writes — pods that
              persist data (Prometheus TSDB, Grafana, Chronicle,
              sn-translator SQLite) start failing. Free space:

                sudo du -sh /var/lib/rancher/k3s/* 2>/dev/null | sort -h
                docker system prune -af  # safe on workload nodes

    - name: host-availability
      interval: 30s
      rules:
        - alert: NodeExporterDown
          expr: up{job=~"node-.*"} == 0
          for: 3m
          labels:
            severity: critical
            team: infrastructure
          annotations:
            summary: "Node exporter scrape failing for {{ $labels.instance }}"
            description: |
              Prometheus has been unable to scrape node-exporter on
              {{ $labels.instance }} for 3 minutes. Could mean: the node
              is down, the node-exporter pod has crashed, or the
              Tailscale mesh has a route flap between the watchtower
              and {{ $labels.instance }}.

              Check Tailscale first (most common):

                tailscale ping {{ $labels.instance }}
                tailscale status

              Then the node-exporter DaemonSet:

                kubectl -n monitoring get pods -l app=node-exporter -o wide
