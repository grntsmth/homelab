# Prometheus community chart source. Polled hourly — chart releases land
# weekly-ish but we don't auto-upgrade (pin in helmrelease.yml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
