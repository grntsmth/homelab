# =============================================================================
# kube-prometheus-stack — Helm release.
#
# Bundles Prometheus + Alertmanager + Grafana + node-exporter +
# kube-state-metrics + prometheus-operator into one chart. Replaces the
# handwritten stack in monitoring/monitoring.yml on cutover.
#
# Pre-apply checklist (one-time, before Flux reconciles this):
#   1. The grafana-admin secret must carry BOTH keys the chart expects:
#        kubectl -n monitoring patch secret grafana-admin \
#          -p '{"data":{"admin-user":"YWRtaW4="}}'
#      (YWRtaW4= is base64 for "admin"; admin-password is already there.)
#   2. The Alertmanager Secret `alertmanager-chaos-config` and the chaos
#      PrometheusRules must already be applied — they are sibling
#      Kustomizations in k8s/.
#
# Version pinning: chart 78.x covers the API shape used below
# (alertmanagerSpec.configSecret, prometheusSpec.routePrefix, sidecar.*).
# Bump the version constraint deliberately, not via "latest", so an
# upstream rename doesn't break the cluster silently.
# =============================================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  releaseName: kube-prometheus-stack
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "78.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:

    # -----------------------------------------------------------------------
    # Default rules — keep Kubernetes-level alerts, drop the node-exporter
    # built-ins (overlap with k8s/prometheus-rules/host-health.yml).
    # -----------------------------------------------------------------------
    defaultRules:
      create: true
      rules:
        nodeExporterAlerting: false

    # -----------------------------------------------------------------------
    # Alertmanager
    # -----------------------------------------------------------------------
    alertmanager:
      enabled: true
      # Suppress the chart-generated config Secret — our externally-owned
      # Secret in k8s/alertmanager/alertmanager-config.yml is authoritative.
      config: null
      alertmanagerSpec:
        configSecret: alertmanager-chaos-config
        nodeSelector:
          role: watchtower
        replicas: 1
        retention: 120h
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi
      service:
        type: ClusterIP

    # -----------------------------------------------------------------------
    # Prometheus
    # -----------------------------------------------------------------------
    prometheus:
      enabled: true
      prometheusSpec:
        nodeSelector:
          role: watchtower
        replicas: 1
        retention: 30d
        retentionSize: 18GB           # PVC is 20Gi — leave headroom for WAL
        routePrefix: /prometheus/      # matches existing Traefik IngressRoute
        externalUrl: https://your-domain.example.com/prometheus/
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 20Gi

        # ---- Selector overrides: pick up our rules without the operator
        #      enforcing the chart's release-label match by default.
        ruleSelectorNilUsesHelmValues: false
        ruleSelector:
          matchLabels:
            release: kube-prometheus-stack
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector:
          matchLabels:
            release: kube-prometheus-stack
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector:
          matchLabels:
            release: kube-prometheus-stack
        probeSelectorNilUsesHelmValues: false
        probeSelector:
          matchLabels:
            release: kube-prometheus-stack

        # ---- External scrape targets (not in-cluster, no ServiceMonitor)
        additionalScrapeConfigs:
          - job_name: 'terminal-windows'
            static_configs:
              - targets: ['100.93.245.19:9182']
                labels:
                  instance: 'terminal'
          - job_name: 'terminal-gpu'
            static_configs:
              - targets: ['100.93.245.19:9835']
                labels:
                  instance: 'terminal'
            scrape_interval: 15s

      # Keep NodePort 30090 so the existing IngressRoute Endpoints in
      # kube-system continue to resolve through the worker node.
      service:
        type: NodePort
        nodePort: 30090

    # -----------------------------------------------------------------------
    # Grafana
    # -----------------------------------------------------------------------
    grafana:
      enabled: true

      # Credentials come from the existing in-cluster Secret. The chart
      # expects both `admin-user` and `admin-password` keys — see the
      # pre-apply checklist at the top of this file.
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      # Disable the chart's bundled default dashboards — they duplicate
      # what's already on Grafana.com and we have only one dashboard
      # we care about provisioning (three-realms).
      defaultDashboardsEnabled: false

      persistence:
        enabled: true
        size: 5Gi
        accessModes: [ReadWriteOnce]

      nodeSelector:
        role: watchtower

      # NodePort 30300 keeps the existing Traefik IngressRoute working.
      service:
        type: NodePort
        nodePort: 30300

      # Sidecar pattern: watch labelled ConfigMaps in monitoring/ ns for
      # dashboards. Our three-realms ConfigMap (generated by kustomize)
      # carries the label `grafana_dashboard: "1"` so it gets auto-loaded.
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: monitoring
          provider:
            allowUiUpdates: true       # edits in UI persist back via API
        datasources:
          enabled: true
          label: grafana_datasource
          labelValue: "1"
          searchNamespace: monitoring

      grafana.ini:
        server:
          root_url: https://your-domain.example.com/grafana/
          serve_from_sub_path: true
        analytics:
          # Don't phone home on every page load — homelab is offline-ish.
          reporting_enabled: false
          check_for_updates: false

      # Loki was already in the cluster (monitoring/loki ClusterIP svc).
      # Wired via cluster DNS so we don't depend on hostNetwork like the
      # old Grafana did.
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          jsonData:
            maxLines: 1000

    # -----------------------------------------------------------------------
    # Node exporter — chart's DaemonSet replaces the one in
    # monitoring/monitoring.yml. Tear down the old DaemonSet during cutover.
    # -----------------------------------------------------------------------
    nodeExporter:
      enabled: true

    # -----------------------------------------------------------------------
    # kube-state-metrics — there is ALREADY a kube-state-metrics deployment
    # in kube-system (managed from the private ops repo). To avoid two
    # instances scraping the same data, disable the chart's copy here and
    # add a static scrape config pointing at the existing endpoint.
    # When kube-state-metrics gets folded into this repo, flip these:
    #   - kube-state-metrics.enabled: true
    #   - delete the additionalScrapeConfigs entry for kube-state-metrics
    # -----------------------------------------------------------------------
    kube-state-metrics:
      enabled: false

    # -----------------------------------------------------------------------
    # Prometheus operator
    # -----------------------------------------------------------------------
    prometheusOperator:
      nodeSelector:
        role: watchtower
      admissionWebhooks:
        # cert-manager isn't installed; use the helper job to generate certs
        certManager:
          enabled: false

    # -----------------------------------------------------------------------
    # Windows is monitored as an EXTERNAL scrape target (Tailscale-reachable
    # windows_exporter on terminal). Disable the chart's in-cluster Windows
    # support which assumes Windows nodes in the cluster.
    # -----------------------------------------------------------------------
    windowsMonitoring:
      enabled: false

    # CRDs are managed by Helm's install.crds: Create above.
    crds:
      enabled: true
