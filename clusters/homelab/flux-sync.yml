# =============================================================================
# Flux GitOps wiring for the homelab cluster.
#
# Apply order (one-time, after `flux install`):
#   kubectl apply -f clusters/homelab/flux-sync.yml
#
# Once applied, Flux will:
#   1. source-controller polls the homelab repo every 1m
#   2. kustomize-controller reconciles ./k8s every 10m against the cluster
#
# The Kustomization below ships with spec.suspend: true because k8s/
# contains a HelmRelease for chaos-mesh that creates a PodMonitor — a CRD
# that doesn't exist until kube-prometheus-stack is installed. Reconciling
# now would put chaos-mesh in a retry loop. Unsuspend after Phase 1.3
# step 7 (apply chaos pipeline pieces) with:
#
#   flux resume kustomization homelab-k8s -n flux-system
# =============================================================================
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  # Public repo — no secretRef needed. Switch to SSH + a deploy-key Secret
  # if/when the repo goes private.
  url: https://github.com/grntsmth/homelab.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-k8s
  namespace: flux-system
spec:
  # Suspended until kube-prometheus-stack lands — see file header.
  suspend: true
  interval: 10m
  timeout: 5m
  retryInterval: 2m
  path: ./k8s
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab
  # Health checks: block the reconcile as "not ready" until the translator
  # deployment is Available. Keeps `flux get kustomization` honest about
  # the cluster's actual state vs. just "manifests applied".
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: sn-translator
      namespace: ecosystem
