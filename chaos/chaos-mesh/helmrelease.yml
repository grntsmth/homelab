# =============================================================================
# Chaos Mesh — installed via FluxCD HelmRelease.
#
# Requires:
#   - flux source-controller + helm-controller installed cluster-wide
#   - The chaos-mesh namespace (see namespace.yml)
#
# The dashboard is disabled because the homelab already exposes Grafana for
# observability and the dashboard's auth model would need separate Traefik
# wiring we don't need yet. Experiments are applied/triggered via
# `kubectl apply -f chaos/experiments/...`.
# =============================================================================
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: chaos-mesh
  namespace: chaos-mesh
spec:
  interval: 1h
  url: https://charts.chaos-mesh.org
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaos-mesh
  namespace: chaos-mesh
spec:
  interval: 30m
  chart:
    spec:
      chart: chaos-mesh
      version: "2.8.x"  # current upstream as of 2026-05-29; semver patch tolerance
      sourceRef:
        kind: HelmRepository
        name: chaos-mesh
        namespace: chaos-mesh
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # ARM64 nodes — chaos-mesh publishes multi-arch images. Letting the
    # chart default images.tag to its appVersion means a `version: "2.8.x"`
    # bump pulls matching images automatically without a separate edit.

    # k3s uses containerd, not docker; the chaos-daemon needs to talk to the
    # right socket on the host.
    chaosDaemon:
      runtime: containerd
      socketPath: /run/k3s/containerd/containerd.sock
      privileged: true

    dashboard:
      create: false

    controllerManager:
      replicaCount: 1
      # Pin to a node with capacity — the control-plane has more RAM than
      # the watchtower worker.
      nodeSelector:
        role: game-server

    dnsServer:
      create: true

    # No prometheus-operator runs here (the kube-prometheus-stack
    # migration was rolled back — see docs/decisions/ADR-001), so a
    # PodMonitor CR would be decorative. Chaos-mesh metrics get scraped
    # the day the CNI decision unblocks operator-style discovery.
    prometheus:
      create: false
    podMonitor:
      enabled: false

    webhook:
      # cert-manager is preferred when present; the helper chart falls back
      # to its own self-signed certs if not. We're not running cert-manager
      # in this lab, so leave certManager disabled.
      certManager:
        enabled: false
