name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      # CRD-aware: the datree catalog supplies schemas for HelmRelease,
      # HelmRepository, HelmChartConfig, SealedSecret, IngressRoute, etc.
      # Skipped kinds: Kustomization (kubectl-native, no server schema) and
      # the Chaos Mesh CRs (not in the catalog; applied manually anyway).
      # Dashboards are Grafana JSON, validated in their own job.
      - name: Validate Kubernetes manifests
        run: |
          kubeconform -strict -summary -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-filename-pattern '.*dashboards/.*' \
            -skip Kustomization,PodChaos,NetworkChaos,StressChaos \
            monitoring/ platform/ apps/sn-translator/manifests/ chaos/

  validate-dashboards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dashboards are valid JSON with stable UIDs
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          seen = {}
          for p in sorted(pathlib.Path("monitoring/dashboards").glob("*.json")):
              d = json.load(open(p))
              uid = d.get("uid")
              assert uid, f"{p}: missing uid"
              assert uid not in seen, f"{p}: uid {uid} duplicates {seen[uid]}"
              seen[uid] = str(p)
              print(f"ok {p} uid={uid} panels={len(d.get('panels', []))}")
          sys.exit(0 if seen else 1)
          EOF

  test-sn-translator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sn-translator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate configuration
        working-directory: terraform
        run: terraform validate
