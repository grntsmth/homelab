# =============================================================================
# Monitoring Stack — "The Watchtower"
# Deployed on star-garden worker node (role=watchtower)
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

---
# =============================================================================
# Prometheus Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            # Alertmanager runs hostNetwork on this same node (both pinned
            # to role=watchtower), so localhost always works. The service
            # name 'alertmanager:9093' does NOT resolve here: this pod is
            # dnsPolicy:None with external nameservers only (see below).
            # That misconfiguration silently dropped every notification
            # for 6 weeks — see the alerting-path panels in the
            # platform-health dashboard, which now watch for exactly this.
            - targets: ['localhost:9093']

    rule_files:
      - '/etc/prometheus/rules/*.yml'
      # Private rule overlay (optional): extra alert groups for workloads
      # that live outside this repo. Mounted from the ConfigMap
      # 'prometheus-private-rules' if it exists; empty otherwise.
      - '/etc/prometheus/rules-private/*.yml'

    # Private scrape overlay (optional): extra scrape jobs for workloads
    # that live outside this repo, supplied by the ConfigMap
    # 'prometheus-private-scrape'. Keeps this file both fully public and
    # fully deployable — private targets never need to be committed here.
    scrape_config_files:
      - '/etc/prometheus/scrape.d/*.yml'

    scrape_configs:
      - job_name: 'prometheus'
        metrics_path: /prometheus/metrics
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'node-high-palace'
        static_configs:
          - targets: ['100.92.211.3:9100']
            labels:
              instance: 'high-palace'

      - job_name: 'node-star-garden'
        static_configs:
          - targets: ['100.123.222.55:9100']
            labels:
              instance: 'star-garden'

      # TERMINAL — Windows workstation via Tailscale
      - job_name: 'terminal-windows'
        static_configs:
          - targets: ['100.93.245.19:9182']
            labels:
              instance: 'terminal'

      - job_name: 'terminal-gpu'
        static_configs:
          - targets: ['100.93.245.19:9835']
            labels:
              instance: 'terminal'
        scrape_interval: 15s

      # kube-state-metrics pod runs on high-palace; a NodePort must be
      # addressed on the node that actually hosts the pod, because
      # cross-node NodePort DNAT rides the broken pod network (see
      # docs/postmortems/2026-05-30-kube-prom-stack-cutover-rollback.md
      # and docs/decisions/). Targeting star-garden's NodePort here left
      # this job down — and every kube_* metric absent — for weeks.
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['100.92.211.3:30082']
        scrape_interval: 30s

      - job_name: 'kubelet-cadvisor-hp'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/cadvisor
        static_configs:
          - targets: ['100.92.211.3:10250']
            labels:
              node: 'high-palace'
        scrape_interval: 30s
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'container_(memory_working_set_bytes|cpu_usage_seconds_total|memory_rss|network_.*)'
            action: keep

      - job_name: 'kubelet-cadvisor-sg'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/cadvisor
        static_configs:
          - targets: ['100.123.222.55:10250']
            labels:
              node: 'star-garden'
        scrape_interval: 30s
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'container_(memory_working_set_bytes|cpu_usage_seconds_total|memory_rss|network_.*)'
            action: keep

      # Alertmanager self-metrics (same node, hostNetwork — localhost).
      # Without this, delivery failures on the Alertmanager->receiver leg
      # are invisible; the platform-health dashboard reads these.
      - job_name: 'alertmanager'
        static_configs:
          - targets: ['localhost:9093']

      # Traefik metrics entrypoint, exposed via svclb hostPort 9101 on the
      # control-plane node (see platform/traefik-config.yml). Per-service
      # request-duration histograms + Let's Encrypt cert expiry.
      - job_name: 'traefik'
        static_configs:
          - targets: ['100.92.211.3:9101']

      # Chronicle app metrics (sync freshness, LLM latency/outcomes, webhook
      # deliveries, agent runs, upcoming-event/conflict gauges). NodePort on
      # the node hosting the pod, same pattern as kube-state-metrics.
      - job_name: 'chronicle'
        metrics_path: /chronicle/metrics
        static_configs:
          - targets: ['100.92.211.3:30890']

      # Synthetic HTTP probes via blackbox-exporter (below, hostNetwork on
      # this node). Targets here are the NodePort health endpoints already
      # documented in this repo; probes against the public domain live in
      # the private scrape overlay.
      - job_name: 'blackbox-http'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://100.92.211.3:30890/chronicle/health # chronicle (serves under its route prefix)
              - http://100.123.222.55:30300/grafana/api/health
              - http://100.123.222.55:30090/prometheus/-/healthy
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: 127.0.0.1:9115

  alerts.yml: |
    groups:
      # CPU thresholds differ per node because workload distribution is
      # uneven: high-palace (role=game-server) runs the game server and
      # the ecosystem app pods, where sustained >90% is expected during
      # world generation or LLM inference — lifted to 95% with a 15m
      # sustain window. star-garden (role=watchtower) runs only this
      # monitoring stack, where sustained CPU is genuinely abnormal —
      # kept at 90% / 10m.
      #
      # team=infrastructure marks platform alerts for routing. Today
      # everything lands in Discord; the label is the taxonomy a future
      # ticketing receiver keys on (a ServiceNow route used it until the
      # dev instance expired — docs/decisions/003).
      - name: host-cpu
        rules:
          - alert: HighCPUUsage
            expr: |
              100 - (
                avg by(instance) (
                  rate(node_cpu_seconds_total{mode="idle",instance="high-palace"}[5m])
                ) * 100
              ) > 95
            for: 15m
            labels:
              severity: warning
              team: infrastructure
              node_role: game-server
            annotations:
              summary: "Sustained high CPU on game-server {{ $labels.instance }}"
              description: |
                CPU usage on {{ $labels.instance }} has held above 95% for
                the last 15 minutes (current: {{ $value | printf "%.1f" }}%).

                high-palace runs the workload pods. Short bursts above 95%
                are normal — this fires only on sustained pegging. Triage:

                  kubectl top pods --all-namespaces --sort-by=cpu | head -10

          - alert: HighCPUUsage
            expr: |
              100 - (
                avg by(instance) (
                  rate(node_cpu_seconds_total{mode="idle",instance="star-garden"}[5m])
                ) * 100
              ) > 90
            for: 10m
            labels:
              severity: warning
              team: infrastructure
              node_role: watchtower
            annotations:
              summary: "Sustained high CPU on watchtower {{ $labels.instance }}"
              description: |
                CPU usage on {{ $labels.instance }} has held above 90% for
                10 minutes (current: {{ $value | printf "%.1f" }}%).

                star-garden runs only the monitoring stack — sustained CPU
                there is genuinely abnormal. Likely causes: Prometheus
                query overload, runaway log ingestion, or an alert storm.

                  kubectl top pods -n monitoring --sort-by=cpu

      - name: host-memory
        rules:
          - alert: HighMemoryUsage
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
            for: 5m
            labels:
              severity: warning
              team: infrastructure
            annotations:
              summary: "High memory usage on {{ $labels.instance }}"
              description: |
                Memory usage on {{ $labels.instance }} is
                {{ $value | printf "%.1f" }}% (threshold: 90%). Identify
                the offender:

                  kubectl top pods --all-namespaces --sort-by=memory | head -10

      - name: host-disk
        rules:
          - alert: DiskSpaceLow
            expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
            for: 5m
            labels:
              severity: critical
              team: infrastructure
            annotations:
              summary: "Disk space low on {{ $labels.instance }}"
              description: |
                Root filesystem on {{ $labels.instance }} is
                {{ $value | printf "%.1f" }}% full (threshold: 85%).

                At 100% the cluster stops admitting writes — everything
                that persists data (Prometheus TSDB, Grafana, app SQLite
                stores) starts failing. Free space:

                  sudo du -sh /var/lib/rancher/k3s/* 2>/dev/null | sort -h

      - name: host-availability
        rules:
          - alert: NodeExporterDown
            expr: up{job=~"node-.*"} == 0
            for: 3m
            labels:
              severity: critical
              team: infrastructure
            annotations:
              summary: "Node exporter scrape failing for {{ $labels.instance }}"
              description: |
                Prometheus has been unable to scrape node-exporter on
                {{ $labels.instance }} for 3 minutes: node down, pod
                crashed, or a Tailscale route flap. Check the mesh first
                (most common):

                  tailscale ping {{ $labels.instance }}

          # Non-node-exporter jobs (kube-state-metrics, cadvisor, GPU and
          # Windows exporters, private overlay jobs) previously had NO
          # down-target alert — kube-state-metrics was down for weeks
          # unnoticed. This catches every remaining job.
          - alert: TargetDown
            expr: up{job!~"node-.*"} == 0
            for: 5m
            labels:
              severity: warning
              team: infrastructure
            annotations:
              summary: "Scrape target down: {{ $labels.job }} ({{ $labels.instance }})"
              description: |
                Prometheus cannot scrape {{ $labels.job }}
                ({{ $labels.instance }}) — the job has been down 5 minutes.

      - name: tls-certs
        rules:
          # Let's Encrypt renews ~30d before expiry; if a cert is inside
          # 14d something in the ACME path is broken and there is still
          # time to fix it calmly.
          - alert: TLSCertExpiringSoon
            expr: (min by (cn) (traefik_tls_certs_not_after) - time()) / 86400 < 14
            for: 1h
            labels:
              severity: warning
              team: infrastructure
            annotations:
              summary: "TLS certificate for {{ $labels.cn }} expires in under 14 days"
              description: |
                ACME auto-renewal should have replaced this cert already —
                check the Traefik logs and the acme.json PVC.

      # First real SLO: ecosystem-service availability, measured by the
      # blackbox probes. Target 99% over 30d (~7.3h error budget).
      # Multi-window multi-burn-rate alerting per the SRE workbook:
      # fast burn (14.4x, budget gone in ~2 days) pages critical;
      # slow burn (6x, gone in ~5 days) warns.
      - name: slo-ecosystem-availability
        rules:
          - record: slo:probe_availability:ratio_rate5m
            expr: avg by (instance) (avg_over_time(probe_success{job="blackbox-http"}[5m]))
          - record: slo:probe_availability:ratio_rate30m
            expr: avg by (instance) (avg_over_time(probe_success{job="blackbox-http"}[30m]))
          - record: slo:probe_availability:ratio_rate1h
            expr: avg by (instance) (avg_over_time(probe_success{job="blackbox-http"}[1h]))
          - record: slo:probe_availability:ratio_rate6h
            expr: avg by (instance) (avg_over_time(probe_success{job="blackbox-http"}[6h]))
          - record: slo:probe_availability:ratio_rate30d
            expr: avg by (instance) (avg_over_time(probe_success{job="blackbox-http"}[30d]))

          - alert: SLOFastBurn
            expr: |
              (1 - slo:probe_availability:ratio_rate1h) > (14.4 * 0.01)
              and
              (1 - slo:probe_availability:ratio_rate5m) > (14.4 * 0.01)
            for: 2m
            labels:
              severity: critical
              team: infrastructure
            annotations:
              summary: "SLO fast burn: {{ $labels.instance }}"
              description: |
                {{ $labels.instance }} is burning its 30d error budget at
                >=14.4x — at this rate the whole budget is gone in under
                two days. Availability last hour:
                {{ with printf "slo:probe_availability:ratio_rate1h{instance='%s'}" $labels.instance | query }}{{ . | first | value | printf "%.3f" }}{{ end }}

          - alert: SLOSlowBurn
            expr: |
              (1 - slo:probe_availability:ratio_rate6h) > (6 * 0.01)
              and
              (1 - slo:probe_availability:ratio_rate30m) > (6 * 0.01)
            for: 15m
            labels:
              severity: warning
              team: infrastructure
            annotations:
              summary: "SLO slow burn: {{ $labels.instance }}"
              description: |
                {{ $labels.instance }} has burned error budget at >=6x for
                6 hours. Not urgent, but the 30d budget disappears in
                ~5 days at this rate.

      - name: ecosystem-chronicle
        rules:
          # The blackbox probe catches Chronicle being down; this catches it
          # being up but quietly broken — an expired OAuth refresh token
          # presents exactly this way (sync interval is 10m, so >1h without
          # a success means every retry since has failed).
          - alert: ChronicleSyncStale
            expr: time() - chronicle_sync_last_success_timestamp_seconds{job="chronicle"} > 3600
            for: 10m
            labels:
              severity: warning
              team: infrastructure
            annotations:
              summary: "Chronicle {{ $labels.source }} calendar sync is stale"
              description: |
                No successful {{ $labels.source }} sync for over an hour
                (interval: 10m). Expired/revoked OAuth tokens look exactly
                like this — check /chronicle/health and the pod logs, and
                re-auth via /chronicle/oauth/{{ $labels.source }} if needed.

      - name: alerting-path
        rules:
          # Watches the notification path itself. If Alertmanager is
          # unreachable this alert cannot page anyone either — that is
          # inherent (a dead path cannot report its own death). Its value
          # is on the Grafana alert list and the platform-health
          # dashboard, which is where 6 weeks of silent delivery failure
          # would have been visible in minutes.
          - alert: NotificationDeliveryBroken
            expr: increase(prometheus_notifications_errors_total[10m]) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Prometheus cannot deliver notifications to Alertmanager"
              description: |
                Notification sends to Alertmanager are erroring
                ({{ $value | printf "%.0f" }} in the last 10m). Every
                alert is being dropped before it can reach any receiver.
                Verify Alertmanager is up on this node and reachable at
                the address in prometheus.yml's alerting block.

---
# =============================================================================
# Prometheus RBAC — ServiceAccount for kubelet/cadvisor scraping
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring

---
# =============================================================================
# Prometheus Deployment — pinned to star-garden
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      nodeSelector:
        role: watchtower
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 169.254.169.254
          - 8.8.8.8
          - 1.1.1.1
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v3.11.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.retention.time=30d'
            - '--web.external-url=/prometheus/'
            - '--web.route-prefix=/prometheus/'
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules/alerts.yml
              subPath: alerts.yml
            # Private overlays — empty directories unless the optional
            # ConfigMaps exist (they are managed outside this repo).
            - name: private-scrape
              mountPath: /etc/prometheus/scrape.d
            - name: private-rules
              mountPath: /etc/prometheus/rules-private
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: private-scrape
          configMap:
            name: prometheus-private-scrape
            optional: true
        - name: private-rules
          configMap:
            name: prometheus-private-rules
            optional: true
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090

---
# =============================================================================
# Grafana
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      nodeSelector:
        role: watchtower
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 169.254.169.254
          - 8.8.8.8
          - 1.1.1.1
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: grafana/grafana:12.4.2
          ports:
            - containerPort: 3000
          env:
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
          # GF_SERVER_ROOT_URL (the real public URL) comes from the
          # out-of-band 'grafana-env' ConfigMap, like the admin password
          # comes from a Secret. A placeholder value here once shipped to
          # production verbatim — committed manifests must never carry
          # values that need post-apply editing.
          #   kubectl -n monitoring create configmap grafana-env \
          #     --from-literal=GF_SERVER_ROOT_URL=https://<your-domain>/grafana/
          envFrom:
            - configMapRef:
                name: grafana-env
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
            optional: true

---
# Dashboards-as-code: Grafana provisions every JSON in the
# 'grafana-dashboards' ConfigMap (created from monitoring/dashboards/ —
# see monitoring/README.md). The repo copy IS the live copy; UI edits
# that aren't exported back get reconciled away on the next sync.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yml: |
    apiVersion: 1
    providers:
      - name: repo-dashboards
        folder: ""
        type: file
        updateIntervalSeconds: 60
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300

---
# =============================================================================
# AlertManager + Discord Webhook
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: discord
      group_by: ['alertname', 'severity', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Critical → Discord at faster cadence. (A ServiceNow route once
        # lived here, fed by sn-translator; retired 2026-07-12 when the
        # dev instance expired — see docs/decisions/003. The
        # team=infrastructure labels on the rules remain as the routing
        # taxonomy for whatever receiver comes next.)
        - match:
            severity: critical
          receiver: discord
          repeat_interval: 1h
    receivers:
      - name: discord
        webhook_configs:
          - url: 'http://localhost:9097'
            send_resolved: true

  discord-webhook.py: |
    #!/usr/bin/env python3
    """Translates Prometheus Alertmanager webhooks into Discord embeds."""
    import json, sys, os
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from urllib.request import Request, urlopen

    DISCORD_WEBHOOK = os.environ.get("DISCORD_WEBHOOK_URL", "")
    COLORS = {"critical": 14177041, "warning": 16760576, "info": 3447003}
    RESOLVED_COLOR = 3066993

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
            embeds = []
            for alert in body.get("alerts", []):
                status = alert.get("status", "firing")
                severity = alert["labels"].get("severity", "info")
                color = RESOLVED_COLOR if status == "resolved" else COLORS.get(severity, 3447003)
                title = f"{'RESOLVED' if status == 'resolved' else status.upper()}: {alert['labels'].get('alertname', 'Unknown')}"
                desc = alert.get("annotations", {}).get("description", "")
                summary = alert.get("annotations", {}).get("summary", "")
                embeds.append({
                    "title": title,
                    "description": f"**{summary}**\n{desc}" if summary else desc,
                    "color": color,
                    "footer": {"text": f"Severity: {severity}"},
                })
            if embeds:
                payload = json.dumps({"embeds": embeds[:10]}).encode()
                req = Request(DISCORD_WEBHOOK, data=payload, headers={"Content-Type": "application/json", "User-Agent": "Homelab-Alertmanager/1.0"})
                urlopen(req)
            self.send_response(200)
            self.end_headers()
        def log_message(self, fmt, *args):
            print(f"[webhook] {fmt % args}", flush=True)

    if __name__ == "__main__":
        print(f"Discord webhook relay listening on :9097", flush=True)
        HTTPServer(("0.0.0.0", 9097), Handler).serve_forever()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      nodeSelector:
        role: watchtower
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        # Cluster DNS (10.43.0.10) is intentionally NOT here: this pod is
        # hostNetwork, and the cluster's broken kube-proxy/iptables means
        # hostNetwork → ClusterIP returns "no route to host". Putting
        # CoreDNS first would hang every external DNS lookup until the
        # CoreDNS attempt timed out. The servicenow webhook URL uses a
        # literal node IP instead — see docs/postmortems/2026-05-30-...
        nameservers:
          - 169.254.169.254
          - 8.8.8.8
          - 1.1.1.1
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.31.1
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
          ports:
            - containerPort: 9093
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
        - name: discord-webhook
          image: python:3.12-slim
          command: ["python3", "/app/discord-webhook.py"]
          ports:
            - containerPort: 9097
          env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alertmanager-discord
                  key: webhook-url
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /app/discord-webhook.py
              subPath: discord-webhook.py
      volumes:
        - name: config
          configMap:
            name: alertmanager-config

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093

---
# =============================================================================
# Blackbox exporter — synthetic HTTP probes (uptime + latency SLIs).
# hostNetwork on the watchtower node so Prometheus reaches it at
# 127.0.0.1:9115 and probes can reach NodePorts/domains over the host's
# Tailscale routing (pods can't — see ADR-001).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        # 10s: some probed pages (map renderers) legitimately take >5s
        # cold; must stay under the 15s scrape interval.
        timeout: 10s
        http:
          preferred_ip_protocol: ip4
          follow_redirects: true
          valid_status_codes: []  # default: 2xx

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  replicas: 1
  # Recreate, not RollingUpdate: hostNetwork means the new pod cannot
  # bind :9115 while the old one is still alive — a rolling update
  # deadlocks on the port. Same reason as Prometheus/Grafana above.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      nodeSelector:
        role: watchtower
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 169.254.169.254
          - 8.8.8.8
          - 1.1.1.1
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.25.0
          args:
            - '--config.file=/etc/blackbox/blackbox.yml'
          ports:
            - containerPort: 9115
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
      volumes:
        - name: config
          configMap:
            name: blackbox-config

---
# =============================================================================
# Node Exporter — DaemonSet on ALL nodes
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.10.2
          args:
            - '--path.procfs=/host/proc'
            - '--path.sysfs=/host/sys'
            - '--path.rootfs=/host/root'
          ports:
            - containerPort: 9100
              hostPort: 9100
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              mountPropagation: HostToContainer
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
