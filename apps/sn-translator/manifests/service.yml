# NodePort — chosen over ClusterIP because the cluster's pod-network
# is non-functional (see docs/postmortems/2026-05-30-...). hostNetwork
# pods like Alertmanager can't reach ClusterIPs through the broken
# kube-proxy iptables path, but NodePort on the SAME node as the
# target pod works (no cross-node hop needed).
#
# sn-translator is pinned to role=game-server (high-palace); webhook
# senders should target 100.92.211.3:30891 directly.
apiVersion: v1
kind: Service
metadata:
  name: sn-translator
  namespace: ecosystem
  labels:
    app: sn-translator
spec:
  type: NodePort
  selector:
    app: sn-translator
  ports:
    - name: http
      port: 8091
      targetPort: 8091
      nodePort: 30891
      protocol: TCP
