# sn-translator — Alertmanager → ServiceNow webhook bridge.
# Pinned to high-palace (control-plane) alongside Chronicle so the only
# cross-node call is monitoring → translator over the Tailscale mesh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sn-translator
  namespace: ecosystem
  labels:
    app: sn-translator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sn-translator
  template:
    metadata:
      labels:
        app: sn-translator
    spec:
      nodeSelector:
        role: game-server
      containers:
        - name: sn-translator
          image: sn-translator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
              name: http
          env:
            - name: SN_TRANSLATOR_PORT
              value: "8091"
            - name: SN_TRANSLATOR_DB
              value: /data/incidents.db
          # sn-translator-credentials: SealedSecret (SN_USER/SN_PASSWORD).
          # sn-translator-env: out-of-band ConfigMap carrying SN_INSTANCE
          # (the real PDI hostname) and SN_NAMESPACE_CATEGORIES — values
          # that are deployment-specific and stay out of this public repo:
          #   kubectl -n ecosystem create configmap sn-translator-env \
          #     --from-literal=SN_INSTANCE=devXXXXXX.service-now.com
          envFrom:
            - secretRef:
                name: sn-translator-credentials
            - configMapRef:
                name: sn-translator-env
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sn-translator-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sn-translator-data
  namespace: ecosystem
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
